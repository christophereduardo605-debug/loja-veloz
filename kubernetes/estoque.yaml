apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque
spec:
  replicas: 1
  selector:
    matchLabels:
      app: estoque
  template:
    metadata:
      labels:
        app: estoque
    spec:
      containers:
        - name: estoque
          image: loja-veloz-estoque:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: estoque
spec:
  selector:
    app: estoque
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP
